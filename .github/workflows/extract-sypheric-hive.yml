
name: Extract Sypheric Hive ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*sypheric*hive*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Sypheric Hive ZIP file not found in repository root."
            exit 1
          fi

          TEMP_DIR=$(mktemp -d)

          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          PROJECT_DIR="$TEMP_DIR/sypheric-hive-cloudflare"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "Project files not found inside ZIP."
            exit 1
          fi

          mkdir -p sypheric-hive
          cp -a "$PROJECT_DIR"/. sypheric-hive/

          rm -rf "$TEMP_DIR"
          rm -f "$ZIP_FILE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Sypheric Hive project"
            git push
          fi
